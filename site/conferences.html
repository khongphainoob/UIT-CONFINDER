<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Khám phá hội nghị · UIT ConFinder</title>
  <link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages/conference-list.css">
  <script type="module" src="js/pages/conference-list.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <header class="site-header" data-site-header></header>
  <main id="main" class="container stack">
    <header class="page-head explore-hero">
      <span class="explore-hero__icon" aria-hidden="true">⌛</span>
      <div class="explore-hero__content">
        <p class="explore-eyebrow">Tra cứu hội nghị khoa học</p>
        <h1>Khám phá hội nghị</h1>
        <p class="page-head__lead">Tìm hạn nộp phù hợp, sắp xếp danh sách và lưu lại hội nghị bạn quan tâm.</p>
      </div>
    </header>
    <div class="explore-layout">
      <aside class="explore-sidebar" aria-label="Bộ lọc hội nghị">
        <section id="filter-root" aria-label="Bộ tìm và lọc"></section>
      </aside>
      <section class="explore-results" aria-label="Danh sách hội nghị">
        <div class="result-bar">
          <div>
            <h2>Hạn nộp sắp tới</h2>
            <p id="result-status" role="status" aria-live="polite"></p>
          </div>
          <div id="active-filters" class="active-filters" aria-label="Bộ lọc đang áp dụng"></div>
        </div>
        <section id="page-content" class="stack" aria-label="Kết quả hội nghị"></section>
        <nav id="pagination" aria-label="Phân trang"></nav>
      </section>
    </div>
  </main>
  <footer class="site-footer" data-site-footer></footer>
  <noscript>Hãy bật JavaScript để dùng tra cứu hội nghị.</noscript>
</body>
</html>
