<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Khám phá hội nghị · UIT ConFinder</title>
  <link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css">

  <script type="module" src="js/pages/conference-list.js"></script>
</head>
<body>

    <section id="page-content" class="stack" aria-label="Kết quả hội nghị"></section>
    <nav id="pagination" aria-label="Phân trang"></nav>
