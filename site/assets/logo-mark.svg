<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
  <title>UIT ConFinder</title>
  <!-- Chữ C = vòng đếm ngược tâm (16,16), vành từ bán kính 8 đến 12; khe phải là phần thời gian đã trôi.
       Mỗi đoạn là một hình vành khuyên tô đặc: cung ngoài, mặt cắt, cung trong; đầu ngoài có góc bo 1.4 -->
  <defs>
    <g id="c-shape">
      <!-- Cung chính: từ +31° đi vòng qua trái lên -65° (đầu dưới bo góc, đầu trên cắt thẳng sát vạch mốc) -->
      <path d="M25.38 23.48 A12 12 0 1 1 21.07 5.12 L19.38 8.75 A8 8 0 1 0 22.17 21.1 A1.4 1.4 0 0 1 23.97 20.79 L25.01 21.41 A1.4 1.4 0 0 1 25.38 23.48Z"/>
      <!-- Đoạn đuôi sau vạch mốc: -45° đến -18° -->
      <path d="M24.49 7.51 A12 12 0 0 1 26.82 10.82 A1.4 1.4 0 0 1 25.99 12.75 L24.84 13.13 A1.4 1.4 0 0 1 23.16 12.42 A8 8 0 0 0 21.66 10.34Z"/>
    </g>
    <!-- Vòng tím nhạt = phần chữ C nằm trong bán kính 9.6 -->
    <clipPath id="inner-band"><circle cx="16" cy="16" r="9.6"/></clipPath>
  </defs>
  <use href="#c-shape" fill="#5b2d9b"/>
  <use href="#c-shape" fill="#8f6dc0" clip-path="url(#inner-band)"/>
  <!-- Vạch hồng = mốc hạn chót, đặt theo bán kính ở -55° -->
  <line x1="21.45" y1="8.22" x2="24.6" y2="3.71" stroke="#d6336c" stroke-width="2.2" stroke-linecap="round"/>
</svg>
